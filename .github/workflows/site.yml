name: Build site

# Builds the website from data/ with Astro.
# Pull requests to main: build only, the site is attached to the run as the `github-pages` artifact.
# Push to main (a merged PR) or a manual run on main: build and deploy to GitHub Pages.

on:
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "site/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "site/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  # Never cancel a deployment halfway; superseded pull request builds can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and type-check
        run: |
          npm test
          npm run typecheck

      - name: Build the site
        run: npm run site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
