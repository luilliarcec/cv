# Website settings that are the same in every language. The PDF ignores this file.
url: https://luilliarcec.github.io/cv
repository: https://github.com/luilliarcec/cv
# Must match ASSET_PREFIX in .github/workflows/build-cv.yml: the site links to the latest release's PDFs.
pdfPrefix: Luis-Arce-CV

# The scrolling strip under the hero.
ticker:
  - Laravel
  - Octane
  - PostgreSQL
  - Claude Code
  - MCP
  - Next.js
  - React Native
  - Rust
  - AWS
  - Keycloak
  - RabbitMQ
  - MongoDB
  - HL7
  - Apache Camel
  - Docker
  - Typesense

# Technologies listed under each entry or project, by id.
stack:
  efy: [Claude Code, MCP, Orca, Laravel 12, Node.js, TypeScript, AWS, Next.js 16, Expo]
  rudy: [Laravel 13, Octane, PostgreSQL 17, Next.js 16]
  healthhero: [Laravel, AWS, HL7, MongoDB, Typesense, Azure]
  teamq-sbs: [Laravel 13, Keycloak, RabbitMQ, MongoDB]
  tpg: [Laravel, Keycloak, NestJS, Apache Camel, Kubernetes]
